name: todoapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.7
  dartz: ^0.10.1

  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

  image_picker: ^1.0.0
  file_picker: ^8.0.0
  share_plus: ^12.0.0

  record: ^7.0.0
  audioplayers: ^6.0.0
  speech_to_text: ^7.4.0

  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true